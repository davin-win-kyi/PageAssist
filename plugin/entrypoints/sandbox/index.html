<!doctype html>
<!--
The page the widget's sandboxed iframe loads, which runs main.ts
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PageAssist widget sandbox</title>
    <style>
      /*
      Note: size and more are not defined in order to allow the widget
      to automatically resize to the content size which will be in the iframe. 
      */
      html, body { margin: 0; padding: 0; }
      body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
